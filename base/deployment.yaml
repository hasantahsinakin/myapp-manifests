apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/hasantahsinakin/myapp:latest
          ports:
            - containerPort: 8080
          # --- DEĞİŞKEN ENJEKSİYONU BURADA BAŞLIYOR ---
          env:
            # ConfigMap'ten veri çekme
            - name: APPLICATION_ENV
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: APP_ENV
            - name: EXTERNAL_API_URL
              valueFrom:
                configMapKeyRef:
                  name: myapp-config
                  key: API_URL
            # Secret'tan hassas veri çekme
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: myapp-secret
                  key: DATABASE_PASSWORD
          # --- DEĞİŞKEN ENJEKSİYONU BURADA BİTİYOR ---
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
